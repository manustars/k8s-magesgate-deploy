apiVersion: v1
kind: ConfigMap
metadata:
  name: avahi-config
  namespace: share
data:
  avahi-daemon.conf: |
    [server]
    # Nome che apparirà sul Finder
    host-name=share
    domain-name=hq.marsellihome.com

    # Limita Avahi all'interfaccia della rete share
    allow-interfaces=ovs-share

    use-ipv4=yes
    use-ipv6=no
    enable-dbus=no

    # rate limit non necessario in reti piccole
    #ratelimit-interval-usec=1000000
    #ratelimit-burst=1000

    [wide-area]
    # non serve se usi solo mDNS locale
    #enable-wide-area=yes

    [publish]
    publish-hinfo=no

    # non necessario per TimeMachine
    #publish-workstation=no

    [reflector]
    # serve solo se fai bridging tra VLAN
    enable-reflector=no

    [rlimits]
    rlimit-core=0
    rlimit-data=4194304
    rlimit-fsize=0
    rlimit-nofile=768
    rlimit-stack=4194304
    rlimit-nproc=3

  timemachine.service: |
    <?xml version="1.0" standalone='no'?>
    <!DOCTYPE service-group SYSTEM "avahi-service.dtd">
    <service-group>
      <name replace-wildcards="yes">%h</name>

      <service>
        <type>_adisk._tcp</type>
        <txt-record>sys=waMa=0,adVF=0x100</txt-record>
        <txt-record>dk0=adVN=Backup,adVF=0x82</txt-record>
      </service>

      <!--
      NON serve per Time Machine e causa l'errore
      "Failed to add service '_smb._tcp': Not supported"
      nelle build container di Avahi
      -->
      <!--
      <service>
        <type>_smb._tcp</type>
        <port>445</port>
      </service>
      -->
    </service-group>